<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O Level Prep — NIELIT Exam Companion</title>
<meta name="theme-color" content="#0A0E17">
<meta name="description" content="NIELIT O Level (R5) exam preparation — full syllabus, quizzes, mock tests, notes, flashcards, code playground, AI assistant. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root{
    --bg-deep:#0A0E17; --bg-panel:#10151F;
    --glass:rgba(255,255,255,0.06); --glass-border:rgba(255,255,255,0.12);
    --cyan:#64FFDA; --amber:#FFC46B; --violet:#9D7BFF;
    --text-primary:#E8ECF1; --text-secondary:#8B96A8; --text-muted:#5A6478;
    --success:#4ADE80; --error:#FF6B6B;
    --grad1:#0A0E17; --grad2:#141B2E;
  }
  html[data-theme="light"]{
    --bg-deep:#F4F7FB; --bg-panel:#FFFFFF;
    --glass:rgba(10,20,40,0.045); --glass-border:rgba(10,20,40,0.10);
    --cyan:#0FA98A; --amber:#C97C00; --violet:#6C4CD1;
    --text-primary:#111827; --text-secondary:#4B5567; --text-muted:#8A93A3;
    --success:#1E9E5A; --error:#D6403F;
    --grad1:#F4F7FB; --grad2:#E7EEF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:linear-gradient(135deg,var(--grad1),var(--grad2)); color:var(--text-primary);
    font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; font-weight:700;}
  #app{max-width:480px; margin:0 auto; padding-bottom:88px; min-height:100vh; position:relative;}

  #circuit-bg{position:fixed; inset:0; z-index:-1; opacity:0.5;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px;}
  .brand-icon{width:38px;height:38px;border-radius:12px;background:rgba(100,255,218,0.12);
    border:1px solid rgba(100,255,218,0.35); display:flex;align-items:center;justify-content:center;font-size:18px;}
  .muted{color:var(--text-secondary); font-size:14px;}
  .tiny{color:var(--text-muted); font-size:12px;}

  .glass{background:var(--glass); border:1px solid var(--glass-border); border-radius:18px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:18px;}
  .container{padding:0 20px;}

  .btn{display:block; width:100%; text-align:center; padding:15px; border-radius:14px; border:none;
    font-weight:600; font-size:15px; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--cyan); color:#0A0E17;}
  .btn-outline{background:transparent; border:1.4px solid var(--cyan); color:var(--cyan);}
  .btn:active{transform:scale(0.98);}

  input, .input{width:100%; padding:14px; border-radius:12px; border:1px solid var(--glass-border);
    background:var(--glass); color:var(--text-primary); font-size:15px; font-family:inherit; margin-bottom:12px;}
  input::placeholder{color:var(--text-muted);}
  input:focus{outline:none; border-color:var(--cyan);}

  .module-card{margin-bottom:16px; cursor:pointer;}
  .badge{display:inline-block; padding:4px 10px; border-radius:8px; background:rgba(100,255,218,0.12);
    color:var(--cyan); font-size:12px; font-weight:700;}
  .progress-track{height:6px;border-radius:6px;background:var(--glass-border);overflow:hidden;margin-top:10px;}
  .progress-fill{height:100%;background:var(--cyan);border-radius:6px;transition:width .4s;}

  .topic-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--glass-border); cursor:pointer;}
  .topic-row:last-child{border-bottom:none;}

  .option{padding:14px;border-radius:12px;border:1px solid var(--glass-border);margin-bottom:10px;
    display:flex;align-items:center;gap:12px;cursor:pointer;}
  .option.selected{border-color:var(--cyan); background:rgba(100,255,218,0.1);}
  .option.correct{border-color:var(--success); background:rgba(74,222,128,0.12);}
  .option.wrong{border-color:var(--error); background:rgba(255,107,107,0.12);}
  .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted); flex-shrink:0;}
  .option.selected .radio{border-color:var(--cyan); background:radial-gradient(var(--cyan) 40%, transparent 42%);}

  .bottomnav{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:rgba(16,21,31,0.85); backdrop-filter:blur(18px); border-top:1px solid var(--glass-border);
    display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom));}
  html[data-theme="light"] .bottomnav{background:rgba(255,255,255,0.85);}
  .navbtn{flex:1; text-align:center; background:none; border:none; color:var(--text-muted);
    font-family:inherit; font-size:10.5px; cursor:pointer; padding:6px;}
  .navbtn.active{color:var(--cyan);}
  .navbtn .icon{font-size:19px; display:block; margin-bottom:2px;}

  .install-banner{position:fixed; left:20px; right:20px; bottom:96px; max-width:440px; margin:0 auto;
    display:none; z-index:20;}
  .install-banner.show{display:block;}

  .stat-row{display:flex; justify-content:space-around; text-align:center;}
  .score-ring{position:relative; width:180px; height:180px; margin:0 auto;}

  .iconbtn{background:var(--glass); border:1px solid var(--glass-border); border-radius:10px;
    padding:8px 12px; color:var(--text-primary); font-size:13px; cursor:pointer; font-family:inherit;}
  .backlink{background:none;border:none;color:var(--cyan);font-size:14px;font-weight:600;cursor:pointer;padding:0;font-family:inherit;}

  .search-box{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:14px;}
  .search-box input{margin:0;border:none;background:transparent;padding:0;}

  .chip{background:var(--glass); border:1px solid var(--glass-border); border-radius:20px;
    padding:8px 14px; font-size:12.5px; color:var(--text-secondary); cursor:pointer; font-family:inherit; font-weight:600;}
  .chip-accent{background:rgba(100,255,218,0.14); border-color:var(--cyan); color:var(--cyan);}
  .chip-star{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
  .chip-star.active{color:var(--amber);}

  .flip-card{perspective:1200px; height:220px;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
  .flip-inner.flipped{transform:rotateY(180deg);}
  .flip-front,.flip-back{position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;}
  .flip-back{transform:rotateY(180deg);}
  .flip-text{font-size:20px; font-weight:700; margin-top:12px; padding:0 10px;}

  .chat-box{height:calc(100vh - 300px); min-height:280px; overflow-y:auto; padding:4px;}
  .chat-msg{display:flex; margin-bottom:12px;}
  .chat-msg.user{justify-content:flex-end;}
  .chat-bubble{max-width:80%; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.5;
    background:var(--glass); border:1px solid var(--glass-border); white-space:pre-wrap;}
  .chat-msg.user .chat-bubble{background:rgba(100,255,218,0.14); border-color:var(--cyan);}

  .code-editor{width:100%; min-height:140px; font-family:'JetBrains Mono',monospace; font-size:13px;
    background:var(--bg-panel); border:1px solid var(--glass-border); border-radius:12px; padding:14px;
    color:var(--text-primary); resize:vertical; line-height:1.5;}
  .code-output{width:100%; min-height:140px; background:#fff; border:1px solid var(--glass-border);
    border-radius:12px; color:#111; font-family:'JetBrains Mono',monospace; font-size:13px;}

  .ach-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .ach-item{text-align:center; padding:10px 4px; border-radius:12px; background:var(--glass);
    border:1px solid var(--glass-border); opacity:0.35; filter:grayscale(1);}
  .ach-item.unlocked{opacity:1; filter:none; border-color:var(--cyan);}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<canvas id="circuit-bg"></canvas>
<div id="app"></div>
<div class="bottomnav" id="bottomnav" style="display:none">
  <button class="navbtn" data-nav="dashboard"><span class="icon">🏠</span>Home</button>
  <button class="navbtn" data-nav="study"><span class="icon">📖</span>Study</button>
  <button class="navbtn" data-nav="playground"><span class="icon">💻</span>Code</button>
  <button class="navbtn" data-nav="assistant"><span class="icon">🤖</span>AI</button>
  <button class="navbtn" data-nav="profile"><span class="icon">📊</span>Profile</button>
</div>
<div class="install-banner glass" id="installBanner">
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="flex:1;">
      <div style="font-weight:600;font-size:14px;">App install karein</div>
      <div class="tiny">Home screen se seedha khulega, offline bhi kaam karega</div>
    </div>
    <button class="btn btn-primary" style="width:auto;padding:10px 16px;font-size:13px;" id="installBtn">Install</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
